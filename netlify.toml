[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  included_files = [
    "netlify/functions/Form_GST.docx",
    "netlify/functions/Form_NGST.docx",
    "Form_GST.docx",
    "Form_NGST.docx",
    "gstHelper.js",
    "netlify/functions/gstHelper.js"
  ]

[[redirects]]
  from = "/generate"
  to = "/.netlify/functions/generate"
  status = 200

[[redirects]]
  from = "/api/gst-captcha"
  to = "/.netlify/functions/gst-captcha"
  status = 200

[[redirects]]
  from = "/api/gst-search"
  to = "/.netlify/functions/gst-search"
  status = 200

[[redirects]]
  from = "/api/pan-search"
  to = "/.netlify/functions/pan-search"
  status = 200
